<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>ЛР 03 — сеанс</title>
<link rel="stylesheet" href="auth-lab.css">
</head>
<body>
<h1>Навчальний сеанс</h1>
<p id="state">Не ввійшли</p>

<h2>Реєстрація</h2>
<form id="register">
<label>Ім’я користувача <input name="userName" autocomplete="username" required></label>
<label>Email <input name="email" type="email" autocomplete="email" required></label>
<label>Відображуване ім’я <input name="displayName" maxlength="120" required></label>
<label>Пароль <input name="password" type="password" autocomplete="new-password" required></label>
<button>Зареєструватися</button>
</form>

<h2>Вхід</h2>
<form id="login">
<label>Ім’я <input name="userName" autocomplete="username" required></label>
<label>Пароль <input name="password" type="password" autocomplete="current-password" required></label>
<button>Увійти</button>
</form>
<button id="me">Мій профіль</button>
<button id="logout">Вийти</button>
<dl id="profile"></dl>

<h2>Новий інцидент</h2>
<form id="incident">
<label>Заголовок <input name="title" maxlength="160" required></label>
<label>Опис <textarea name="description" rows="3" maxlength="4000" required></textarea></label>
<label>Серйозність
<select name="severity">
<option>Low</option>
<option>Medium</option>
<option>High</option>
<option>Critical</option>
</select></label>
<label>Час події <input name="occurredAt" type="datetime-local" required></label>
<button>Створити</button>
</form>

<pre id="result"></pre>
<script src="auth-lab.js" defer></script>
</body>
</html>
